<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <!-- The default social preview (og:image) for pages without their own
       card: the logo mark on a panel card over the site's print collage
       (the texture-field token in tokens.css: sky and lavender blocks either side of
       paper, a faint halftone, grain). Rasterized to og-default.png by
       scripts/generate-og-images.mjs. -->
  <defs>
    <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1" fill="#292929" fill-opacity="0.16"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.16  0 0 0 0 0.16  0 0 0 0 0.16  0 0 0 0.3 0"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#ECEAE2"/>
  <rect width="250" height="540" fill="#B0E0FF"/>
  <rect x="710" width="250" height="540" fill="#DAD6FF"/>
  <rect width="960" height="540" fill="url(#halftone)"/>
  <rect width="960" height="540" filter="url(#grain)"/>
  <rect x="300" y="128" width="360" height="292" rx="24" fill="#292929" opacity="0.14"/>
  <rect x="300" y="120" width="360" height="292" rx="24" fill="#F7F7F2"/>
